version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=medy_db
      - REDIS_URL=redis://redis:6379/0
      # You can add RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET here for production
    depends_on:
      - db
      - redis
    volumes:
      # Mount the uploads folder so files aren't lost when the container restarts
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
